events {
    worker_connections 1024;
}

http {
    # Docker ichki DNS orqali konteyner IP'larini dinamik hal qilish.
    # Bu konteyner qayta yaratilganda (yangi IP olganda) eski IP keshda qolib
    # 502 xato bermasligi uchun kerak.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 20M;

    # ══════════════════════════════════════════
    # HTTP → HTTPS redirect + ACME challenge
    # ══════════════════════════════════════════
    server {
        listen 80;
        server_name fmtmufa.uz www.fmtmufa.uz;

        # Let's Encrypt renewal challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ══════════════════════════════════════════
    # HTTPS main server
    # ══════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;
        server_name fmtmufa.uz www.fmtmufa.uz;

        # SSL certificates (Let's Encrypt)
        ssl_certificate     /etc/letsencrypt/live/fmtmufa.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fmtmufa.uz/privkey.pem;

        # SSL hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static files
        location /static/ {
            alias /app/backend/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files (uploaded documents, avatars)
        location /media/ {
            alias /app/backend/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Backend API
        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Django admin
        location /admin/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Next.js) — catch-all
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
