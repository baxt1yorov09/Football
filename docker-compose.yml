version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: uff_license
      POSTGRES_USER: uff_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uff_password}
    # Portlar tashqariga ochilmaydi — faqat ichki Docker tarmog'i orqali
    # (backend, celery) ulanadi. Xavfsizlik uchun muhim.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Portlar tashqariga ochilmaydi — faqat ichki Docker tarmog'i orqali ulanadi.
    restart: unless-stopped

  backend:
    build: ./backend
    # Port tashqariga ochilmaydi — nginx ichki tarmoq orqali ulanadi (backend:8000).
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_ENV=production
      - DATABASE_URL=postgresql://uff_user:${DB_PASSWORD:-uff_password}@db:5432/uff_license
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@ufa.uz}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:3000}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
    restart: unless-stopped

  frontend:
    build: ./frontend
    # Port tashqariga ochilmaydi — nginx ichki tarmoq orqali ulanadi (frontend:3000).
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: unless-stopped

  celery:
    build: ./backend
    command: celery -A config worker -l info
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_ENV=production
      - DATABASE_URL=postgresql://uff_user:${DB_PASSWORD:-uff_password}@db:5432/uff_license
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - backend_media:/app/media
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_ENV=production
      - DATABASE_URL=postgresql://uff_user:${DB_PASSWORD:-uff_password}@db:5432/uff_license
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_media:/app/backend/media:ro
      - backend_static:/app/backend/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_media:
  backend_static:
