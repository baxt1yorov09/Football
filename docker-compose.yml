version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: uff_license
      POSTGRES_USER: uff_user
      POSTGRES_PASSWORD: uff_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://uff_user:uff_password@db:5432/uff_license
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

  celery:
    build: ./backend
    command: celery -A config worker -l info
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://uff_user:uff_password@db:5432/uff_license
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
